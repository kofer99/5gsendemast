<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG-Bild</title>
<!-- Vorlage für assets/img/og.png (1200 × 630). Erzeugen per Screenshot, siehe README („Vorschaubild“). -->
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; margin: 0; background: var(--bg);
    background-image: linear-gradient(rgba(61,255,138,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(61,255,138,.05) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .frame { position: absolute; inset: 24px; border: 3px solid var(--green); }
  .frame::after { content: ''; position: absolute; inset: 9px; border: 1px solid rgba(61,255,138,.35); }
  .top { position: absolute; left: 70px; top: 62px; display: flex; align-items: center; gap: 18px; }
  .top .t { font-family: var(--font-display); font-size: 64px; letter-spacing: 4px; line-height: 1; text-shadow: var(--glow); }
  .top .s { font-size: 17px; letter-spacing: 3px; color: var(--green-dim); margin-top: 6px; }
  .label { position: absolute; left: 72px; top: 222px; font-size: 18px; letter-spacing: 4px; color: var(--green-dim); }
  .count { position: absolute; left: 66px; top: 246px; font-family: var(--font-display); font-size: 150px; line-height: 1; color: var(--green); text-shadow: 0 0 28px rgba(61,255,138,.6); }
  .claim { position: absolute; left: 72px; top: 410px; font-size: 26px; color: var(--green-soft); line-height: 1.45; }
  .claim b { color: var(--amber); font-weight: 500; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 60px; display: flex; justify-content: space-between; font-size: 17px; letter-spacing: 2px; color: var(--green-dim); }
  .stamp { position: absolute; right: 86px; top: 70px; padding: 6px 16px; border: 3px solid var(--amber); color: var(--amber); font-family: var(--font-display); font-size: 36px; letter-spacing: 4px; transform: rotate(-4deg); }
  .radar { position: absolute; right: 70px; top: 190px; width: 300px; height: 300px; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="top">
  <svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#3dff8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10 L7 22 M12 10 L17 22 M8.5 18 H15.5 M9.7 15 H14.3"/><circle cx="12" cy="8" r="1.6"/><path d="M8.5 4.5 a5 5 0 0 0 0 7 M15.5 4.5 a5 5 0 0 1 0 7 M5.8 2 a8.5 8.5 0 0 0 0 12 M18.2 2 a8.5 8.5 0 0 1 0 12"/></svg>

</div>

<div class="claim">Stell 5G-Masten auf und „kontrolliere“ Deutschland.<br>Dann Europa. Dann das <b>Universum</b>.</div>

  <g fill="none" stroke="#3dff8a">
    <circle cx="150" cy="150" r="140" stroke-opacity=".25"/><circle cx="150" cy="150" r="100" stroke-opacity=".3"/>
    <circle cx="150" cy="150" r="60" stroke-opacity=".4"/><circle cx="150" cy="150" r="20" stroke-opacity=".6"/>
    <path d="M150 10 V290 M10 150 H290" stroke-opacity=".2" stroke-dasharray="3 6"/>
  </g>
  <path d="M150 150 L150 10 A140 140 0 0 1 271 80 Z" fill="#3dff8a" fill-opacity=".14"/>
  <g fill="#3dff8a"><circle cx="205" cy="95" r="5"/><circle cx="110" cy="200" r="4"/><circle cx="230" cy="190" r="4"/><circle cx="85" cy="110" r="3"/></g>
