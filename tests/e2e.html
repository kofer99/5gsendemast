<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>E2E – Projekt Sendemast</title>
<style>body{background:#070b08;color:#3dff8a;font:13px/1.5 monospace;padding:16px}.fail{color:#ff6b5c}iframe{width:1280px;height:800px;border:1px solid #1f3a26}</style></head>
<body>
<h1>End-to-End-Test</h1>
<pre id="out">läuft …</pre>
<iframe id="f" title="Spiel"></iframe>
<script type="module">
const out = [];
const log = (ok, msg) => out.push(ok ? `✔ ${msg}` : `<span class="fail">✘ ${msg}</span>`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const until = async (fn, ms = 3000) => { const t0 = Date.now(); while (Date.now() - t0 < ms) { if (fn()) return true; await wait(50); } return fn(); };
localStorage.removeItem('sendemast.save');
const f = document.getElementById('f');
f.src = '/';
await new Promise((r) => f.addEventListener('load', r, { once: true }));
await wait(600);
const w = f.contentWindow, d = w.document;
const $ = (s) => d.querySelector(s);
try {
  log(d.getElementById('dialog').open, 'Begrüßungsdialog offen');
  d.querySelector('#dialog-actions button').click();
  await wait(100);
  log(!d.getElementById('dialog').open, 'Dialog geschlossen');
  log(d.querySelectorAll('.state').length === 16, '16 Bundesländer gezeichnet');
  for (let i = 0; i < 20; i++) $('#pulse-btn').click();
  await wait(900);
  log(await until(() => $('#fp').textContent === '20'), `20 Impulse → FP = ${$('#fp').textContent}`);
  const rows = [...d.querySelectorAll('.bld:not([hidden])')];
  log(rows[0].querySelector('.bld-name').textContent === 'Kleiner Funkmast', 'Shop zeigt Kleinen Funkmast');
  log(await until(() => rows[0].classList.contains('can')), 'Funkmast bezahlbar markiert');
  rows[0].click();
  await wait(900);
  log(await until(() => $('#hand-info').textContent.includes('IN DER HAND')), 'Mast in der Hand');
  log(await until(() => d.querySelector('.map-frame').classList.contains('placing')), 'Karte im Platzier-Modus');
  const by = d.querySelector('.state[data-code="BY"]');
  const r = by.getBoundingClientRect();
  // Mittelpunkt von Bayern über elementFromPoint finden
  let target = null, cx = 0, cy = 0;
  for (let k = 0; k < 200 && !target; k++) {
    cx = r.left + Math.random() * r.width; cy = r.top + Math.random() * r.height;
    if (d.elementFromPoint(cx, cy) === by) target = by;
  }
  by.dispatchEvent(new w.MouseEvent('click', { bubbles: true, clientX: cx, clientY: cy }));
  await wait(300);
  const save = () => JSON.parse(w.localStorage.getItem('sendemast.save') || '{}');
  d.getElementById('btn-save').click();
  await wait(100);
  const s = save();
  log(s.placed?.mast?.BY === 1, 'Mast in Bayern platziert (Spielstand)');
  log(d.querySelectorAll('.mk').length === 1, 'Mast-Symbol auf der Karte');
  log(await until(() => !$('#hand-info').textContent.includes('IN DER HAND')), 'Hand leer');
  log(await until(() => Number($('#controlled').textContent.replace(/\./g, '')) === 1000), `Kontrollierte Menschen = ${$('#controlled').textContent}`);
  // Tabs
  d.getElementById('t-erfolge').click(); await wait(1200);
  log(d.querySelectorAll('.ach.done').length >= 2, `Erfolge freigeschaltet: ${d.querySelectorAll('.ach.done').length}`);
  d.getElementById('t-akte').click(); await wait(200);
  log(d.getElementById('stats').textContent.includes('Impulse gesendet'), 'Statistik sichtbar');
  // Auto-Platzieren
  d.getElementById('t-anlagen').click();
  for (let i = 0; i < 40; i++) $('#pulse-btn').click();
  d.getElementById('autoplace').click();
  await wait(200);
  rows[0].click(); await wait(200);
  log(d.querySelectorAll('.mk').length === 2 && !$('#hand-info').textContent.includes('IN DER HAND'), 'Auto-Platzieren setzt sofort');
  // Ticker
  log($('#ticker-text').textContent.length > 10, 'Ticker hat Text');
  // Export/Import
  d.getElementById('btn-export').click(); await wait(100);
  const ta = d.querySelector('#dialog-body textarea');
  log(ta && ta.value.startsWith('BAfG1:'), 'Export erzeugt BAfG1-String');
  d.querySelector('#dialog-actions .btn-primary').click(); await wait(100);
  // Neuer Einsatz muss wirklich löschen (Regression: alter Stand wurde beim Neuladen zurückgeschrieben)
  d.getElementById('t-akte').click(); await wait(100);
  d.getElementById('btn-reset').click(); await wait(150);
  const reloaded = new Promise((r) => f.addEventListener('load', r, { once: true }));
  d.querySelector('#dialog-actions .btn-danger').click();
  await reloaded; await wait(800);
  const d2 = f.contentWindow.document;
  log(d2.getElementById('dialog').open && d2.getElementById('dialog-title').textContent.includes('WILLKOMMEN'), 'Nach Neustart: Begrüßung erscheint wieder');
  log(d2.getElementById('fp').textContent === '0' && d2.querySelectorAll('.mk').length === 0, 'Nach Neustart: 0 FP, keine Masten');
} catch (e) {
  log(false, 'Ausnahme: ' + e.message);
}
const failed = out.filter((x) => x.includes('fail')).length;
document.getElementById('out').innerHTML = out.join('\n') + `\n\n${out.length - failed}/${out.length} bestanden`;
document.title = failed ? `FAIL ${failed}` : `PASS ${out.length}`;
</script>
</body>
</html>
