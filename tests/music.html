<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Musik – Projekt Sendemast</title>
<style>body{background:#070b08;color:#3dff8a;font:13px/1.6 monospace;padding:16px}.fail{color:#ff6b5c}audio{display:block;margin:4px 0 14px;width:min(640px,100%)}button,select{font:inherit;background:#070b08;color:#3dff8a;border:1px solid #1f3a26;padding:6px 12px;cursor:pointer;margin:4px 6px 4px 0}button:hover{border-color:#3dff8a}button:disabled{opacity:.5}table{border-collapse:collapse}td{padding:2px 12px 2px 0}</style></head>
<body>
<h1>Synthwave-Playlist: Vorschau &amp; Pegel</h1>
<p id="total"></p>
<h2>Anhören</h2>
<p>Stufe (= Eskalationsphase): <select id="lvl"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select> – dann ein Stück wählen. Das Rendern dauert ein paar Sekunden.</p>
<div id="buttons"></div>
<div id="songs"></div>
<h2>Pegelprüfung (jedes Stück komplett, Stufe 5 und Stufe 1 – dauert einige Minuten)</h2>
<pre id="out">rendert …</pre>
<script type="module">
import { Synthwave, MUSIC } from '/assets/js/audio/synthwave.js';
const fmtTime = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;
document.getElementById('total').textContent = `${MUSIC.SONGS.length} Stücke, zusammen ${fmtTime(MUSIC.SECONDS)} Min.: `
  + MUSIC.SONGS.map((s, i) => `${i + 1}. ${s.title} (${s.bpm} BPM${s.spb === 12 ? ', 3/4' : ''}, ${fmtTime(s.seconds)}${s.from > 1 ? ', ab Phase ' + s.from : ''})`).join(' · ');
const out = [];
const log = (ok, msg) => out.push(ok ? `✔ ${msg}` : `<span class="fail">✘ ${msg}</span>`);
// Unter Edge --headless mit --virtual-time-budget wird die Uhr vorgespult, während der Audio-Thread rechnet.
// Kurze Timer halten die Seite beschäftigt, bis das Rendern wirklich fertig ist.
const settle = async (p) => { let done = null; p.then((v) => { done = { v }; }, (e) => { done = { e }; }); while (!done) await new Promise((r) => setTimeout(r, 5)); if (done.e) throw done.e; return done.v; };
const rmsOf = (d) => { let sum = 0; for (const v of d) sum += v * v; return Math.sqrt(sum / d.length); };
const peakOf = (buf) => { let p = 0; for (let c = 0; c < buf.numberOfChannels; c++) for (const v of buf.getChannelData(c)) if (Math.abs(v) > p) p = Math.abs(v); return p; };
const db = (x) => (20 * Math.log10(Math.max(x, 1e-9))).toFixed(1);
function wav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const w = (o, s) => [...s].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); dv.setUint32(4, 36 + len * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, ch, true); dv.setUint32(24, rate, true);
  dv.setUint32(28, rate * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true); w(36, 'data'); dv.setUint32(40, len * ch * 2, true);
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, buf.getChannelData(c)[i])); dv.setInt16(o, v * 32767, true); o += 2; }
  return new Blob([dv], { type: 'audio/wav' });
}

MUSIC.SONGS.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = `${i + 1}. ${s.title}${s.country ? ' (' + s.country + ')' : ''}`;
  b.addEventListener('click', async () => {
    const lvl = Number(document.getElementById('lvl').value);
    const label = b.textContent;
    b.disabled = true; b.textContent = `${label} – rendert …`;
    const buf = await Synthwave.renderOffline({ song: i, intensity: lvl, sampleRate: 32000, volume: 0.8 });
    const a = document.createElement('audio'); a.controls = true; a.src = URL.createObjectURL(wav(buf));
    const h = document.createElement('div'); h.textContent = `${i + 1}. ${s.title} – Stufe ${lvl} (${fmtTime(buf.duration)} Min.)`;
    document.getElementById('songs').prepend(h, a);
    b.disabled = false; b.textContent = label;
  });
  document.getElementById('buttons').append(b);
});

async function main() {
  try {
    const only = new URLSearchParams(location.search).get('songs'); // z. B. ?songs=7,8,9,10 (1-basiert)
    const pick = only ? only.split(',').map((x) => Number(x) - 1) : MUSIC.SONGS.map((_, i) => i);
    for (const i of pick) {
      const s = MUSIC.SONGS[i];
      for (const lvl of [5, 1]) {
        const buf = await settle(Synthwave.renderOffline({ song: i, intensity: lvl, sampleRate: 16000, volume: 1 }));
        const peak = peakOf(buf);
        const secLen = buf.sampleRate * MUSIC.BARS_PER_SECTION * s.spb * s.step;
        const parts = s.order.map((name, k) => rmsOf(buf.getChannelData(0).subarray(Math.floor(k * secLen), Math.floor((k + 1) * secLen))));
        const quiet = Math.min(...parts);
        log(peak < 1 && quiet > 0.01, `${i + 1}. ${s.title}, Stufe ${lvl}: Spitze ${db(peak)} dBFS, leisester Teil ${db(quiet)} dB RMS (${s.order.join(' ')})`);
      }
    }
  } catch (e) {
    log(false, 'Ausnahme: ' + e.message);
  }
  const failed = out.filter((x) => x.includes('fail')).length;
  document.getElementById('out').innerHTML = out.join('\n') + `\n\n${out.length - failed}/${out.length} bestanden`;
  document.title = 'MUSIC DONE';
}
main();
</script>
</body>
</html>
